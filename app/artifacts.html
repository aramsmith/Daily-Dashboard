<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Follow-up artifacts · Daily Board</title>
  <link rel="icon" href="/icon.ico">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="brief-page">
  <header class="topbar">
    <div class="title">
      <p class="eyebrow">Follow-up artifacts · draft</p>
      <h1 id="a-title">Drafting…</h1>
      <p class="date" id="a-when">&nbsp;</p>
      <p class="date" id="a-excluded" hidden></p>
    </div>
    <div class="actions no-export">
      <span class="updated" id="a-progress"></span>
      <button type="button" class="btn" id="a-print" disabled>Print</button>
      <button type="button" class="btn" id="a-word" disabled>Save as Word</button>
      <button type="button" class="btn primary" id="a-save" disabled>Save as HTML</button>
    </div>
  </header>

  <main id="a-body"></main>

  <footer class="foot">
    <span id="a-foot">Drafted live by Microsoft 365 Copilot from your mail, Teams chats and meeting transcripts. Nothing is stored. "[to confirm]" marks facts Copilot could not find. Check everything before you share.</span>
  </footer>

  <script src="/keepalive.js"></script>
  <script src="/artifacts.js"></script>
</body>
</html>
